[project]
name = "backend"
version = "0.0.0"
description = "Backend"
readme = "README.md"
requires-python = ">=3.13.0,<3.14.0"
dependencies = [
    "aiohttp>=3.13.1",
    "argon2-cffi>=23.1.0",
    "celery>=5.4.0",
    "dj-database-url>=2.3.0",
    "django>=5.2.7",
    "django-allauth[socialaccount]==65.7.0",
    "django-cors-headers>=4.7.0",
    "django-ninja>=1.4.3",
    "djangorestframework>=3.17.1",
    "drf-pydantic>=2.9.1",
    "drf-spectacular>=0.29.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "python-decouple>=3.8",
    "polib>=1.2.0",
    "pyyaml>=6.0.1",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "whitenoise>=6.11.0",
    "yarl>=1.9.4",
    "transformers>=5.23.0",
    "torch>=2.15.0",
    "jsonschema>=4.26.0",
    "pyttsx3>=2.90",
]

[tool.pyright]
extraPaths = ["lib"]

[tool.pytest.ini_options]
pythonpath = [".", "lib"]
DJANGO_SETTINGS_MODULE = "conf.settings"

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "httpx>=0.27.0",
    "pytest>=9.0.3",
    "pytest-django>=4.9.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "watchdog>=6.0.0",
    "werkzeug>=3.1.3",
]

# torch from PyPI pulls ~15 NVIDIA CUDA wheels (several GB) on Linux. Containers
# run Whisper on CPU, so use the CPU-only build there; macOS wheels are CPU/MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
