exclude = [
    "**/__pycache__",
    "**/migrations",
]
line-length = 100
indent-width = 4
target-version = "py313"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B008",
    "RUF012",
    "RUF100",
]

[lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[lint.isort]
case-sensitive = true
known-first-party = ["apps", "conf", "dbi18n", "eventcore", "tracker", "uncouple"]

[lint.pycodestyle]
max-line-length = 100
