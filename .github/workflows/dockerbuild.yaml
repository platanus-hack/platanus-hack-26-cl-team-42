name: Push Docker images

on:
  workflow_dispatch:

  # Runs on release of tag
  release:
    types: [released, prereleased]

jobs:
  detect-environment:
    name: Detect environment from tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/rc-v')
    outputs:
      env_suffix: ${{ steps.detect.outputs.env_suffix }}
      build_args: ${{ steps.detect.outputs.build_args }}
    steps:
      - name: Detect environment
        id: detect
        run: |
          if [[ "${{ github.ref }}" == refs/tags/rc-v* ]]; then
            echo "env_suffix=dev" >> $GITHUB_OUTPUT
            echo "build_args<<EOF" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "env_suffix=prd" >> $GITHUB_OUTPUT
            echo "build_args<<EOF" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

